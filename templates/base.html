<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Market - Products</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/htmx.org@1.9.3"></script>
</head>
<body>
    <header>
        <div class="logo">E-Market</div>
        <nav>
            <ul>
                <li><a href="#products" hx-get="/products" hx-target="#product-list">Products</a></li>
                <li><a href="#cart" hx-get="/cart" hx-target="#cart-content">Cart</a></li>
                <li><a href="#orders" hx-get="/orders" hx-target="#orders-content">Orders</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="products">
            <h2>Products</h2>
            <div id="product-list">
                <!-- Products will be loaded here -->
            </div>
        </section>

        <section id="cart">
            <h2>Your Cart</h2>
            <div id="cart-content">
                <!-- Cart items will be loaded here -->
            </div>
        </section>

        <section id="orders">
            <h2>Your Orders</h2>
            <div id="orders-content">
                <!-- Orders will be loaded here -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 E-Market. All rights reserved.</p>
    </footer>

    <script>
        // Additional JavaScript can be added here
    </script>
</body>
</html>
